[project]
name = "attune-radii"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "effect-python[otel]==0.1.0a2",
    "pydantic-ai-slim[openai,openrouter]==2.43.0",
    "pyroaring==1.1.0",
    "rote==0.1.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.39.10",
    "clang==19.1.7",
    "ctypeslib2==2.4.0",
    "fixit==2.2.1",
    "libcst==1.9.0",
    "interrogate==1.7.0",
    "memray==1.19.3",
    "pygount==3.2.0",
    "pytest==9.1.1",
    "pytest-testmon==2.2.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.7",
    "wemake-python-styleguide==1.7.1",
    "xdoctest==1.3.2",
]

[tool.uv]
package = false


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "COM819",
    "CPY001",
    "D203",
    "D206",
    "D213",
    "D300",
    "E111",
    "E114",
    "E117",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 5
max-returns = 3
max-statements = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/conftest.py" = ["S404", "S603"]

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "all"
stubPath = "typings"
enableTypeIgnoreComments = false
failOnWarnings = true
reportAny = "error"
include = ["src", "tests"]
extraPaths = ["src"]

[tool.interrogate]
fail-under = 100
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-private = false
ignore-semiprivate = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
quiet = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--testmon",
    "--xdoctest",
    "-n=8",
    "--dist=worksteal",
    "-q",
]


[tool.fixit]
root = true
enable = [".tests.test_architecture"]
disable = ["fixit.rules"]
