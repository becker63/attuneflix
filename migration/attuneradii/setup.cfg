[flake8]
select = WPS2,WPS4,WPS5,WPS6
exclude = .git,.jj,.venv,.direnv,.attune

max-base-classes = 1
max-decorators = 1
max-awaits = 1

max-imports = 8
max-local-variables = 5
max-arguments = 5
max-returns = 3

max-line-complexity = 8
max-jones-score = 8
max-complexity = 6

max-noqa-comments = 1

per-file-ignores =
    src/attune_radii/model.py: WPS210,WPS221
    tests/conftest.py: WPS221
    tests/test_model.py: WPS221,WPS432
    src/attune_radii/algebra/relation.py: WPS214
    tests/_profile.py: WPS221
    tests/test_swe_explore.py: WPS201,WPS202,WPS210,WPS221
